name: automatepanu-local

# =====================================================================
# LOCAL DEVELOPMENT stack. Production is docker-compose.prod.yml.
#
# Runs the services the app needs; the app itself runs on your machine
# with hot reload:
#
#   docker compose up -d     # db, migrations, postgrest, redis, minio, mailpit
#   npm run dev              # http://localhost:3000 (reads .env.local)
#
#   db         PostgreSQL 17 + pgvector    127.0.0.1:54330
#   migrate    one-shot: roles + db/migrations (re-run: docker compose run --rm migrate)
#   postgrest  private REST layer          127.0.0.1:54331
#   redis      rate limits / caches        127.0.0.1:63790
#   minio      S3 storage                  127.0.0.1:9000 (console :9001)
#   mailpit    catches every email         SMTP 127.0.0.1:1025, inbox http://localhost:8025
#
# Credentials below are FIXED, LOCAL-ONLY values (ports bind to 127.0.0.1)
# and match .env.example's "local development" block. Never reuse them in
# production: docker-compose.prod.yml requires real secrets for everything.
#
# Reset everything (deletes local data):  docker compose down -v
# =====================================================================

x-logging: &logging
  driver: json-file
  options: { max-size: '5m', max-file: '2' }

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: wacrm
      POSTGRES_PASSWORD: local-postgres
    ports: ['127.0.0.1:54330:5432']
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d wacrm']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    image: automatepanu-migrate:local
    restart: 'no'
    logging: *logging
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:local-postgres@db:5432/wacrm
      DATABASE_URL: postgresql://wacrm_owner:local-owner@db:5432/wacrm
      WACRM_OWNER_PASSWORD: local-owner
      WACRM_AUTHENTICATOR_PASSWORD: local-authenticator
    depends_on:
      db: { condition: service_healthy }

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    logging: *logging
    environment:
      PGRST_DB_URI: postgresql://wacrm_authenticator:local-authenticator@db:5432/wacrm
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: wacrm_anon
      PGRST_JWT_SECRET: local-postgrest-jwt-secret-0123456789abcdef
      PGRST_DB_POOL: 5
      PGRST_SERVER_PORT: 3000
      PGRST_OPENAPI_MODE: disabled
    ports: ['127.0.0.1:54331:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--requirepass', 'local-redis', '--appendonly', 'yes']
    environment: { REDISCLI_AUTH: local-redis }
    ports: ['127.0.0.1:63790:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    logging: *logging
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-password
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: 'no'
    logging: *logging
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 local-minio local-minio-password >/dev/null &&
        for b in avatars chat-media flow-media; do mc mb --ignore-existing "local/$$b"; done
    environment: { MC_CONFIG_DIR: /tmp/mc }
    depends_on:
      minio: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    logging: *logging
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

volumes:
  db-data:
  redis-data:
  minio-data:
