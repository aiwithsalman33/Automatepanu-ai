<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">Automate Panu AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- userSpaceOnUse: a bounding-box gradient can't paint the
         zero-height crossbar line -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="170">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>

  <!-- chat bubble (conversation) -->
  <path fill="#FFFFFF" d="M88 50h80a40 40 0 0 1 40 40v56a40 40 0 0 1-40 40h-58l-34 26a6 6 0 0 1-9.6-5.6L72 186.4A40 40 0 0 1 48 146V90a40 40 0 0 1 40-40z"/>

  <!-- "A" drawn as a flow graph (automation): apex + two leaves, joined -->
  <g stroke="url(#ink)" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M128 82 92 154M128 82l36 72"/>
    <path d="M107 126h42" stroke-width="11"/>
  </g>
  <g fill="url(#ink)">
    <circle cx="128" cy="80" r="13"/>
    <circle cx="91" cy="155" r="12"/>
    <circle cx="165" cy="155" r="12"/>
  </g>
  <circle cx="128" cy="80" r="5" fill="#FFFFFF"/>

  <!-- AI sparkle -->
  <path fill="#A78BFA" d="M182 66c1.2 7 3.8 9.6 10.8 10.8-7 1.2-9.6 3.8-10.8 10.8-1.2-7-3.8-9.6-10.8-10.8 7-1.2 9.6-3.8 10.8-10.8z"/>
</svg>
