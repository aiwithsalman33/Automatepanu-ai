name: Migrations

# Boots a clean PostgreSQL 17 + pgvector, applies every db/migrations
# file exactly as the `migrate` container does (twice: the second run must
# be a no-op), starts the private PostgREST and Mailpit, then runs the
# whole database suite (tests/db): tenant isolation, privilege guards,
# native auth, the browser data API, email and first-start accounts.

on:
  pull_request:
    paths:
      - 'tests/db/**'
      - 'db/**'
      - 'src/lib/db/**'
      - 'src/lib/data/**'
      - 'src/lib/auth/**'
      - 'vitest.db.config.mts'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'tests/db/**'
      - 'db/**'
      - 'src/lib/db/**'
      - 'src/lib/data/**'
      - 'src/lib/auth/**'
      - 'vitest.db.config.mts'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted:
    name: Postgres (db/migrations) + database suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: wacrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wacrm"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:admin@localhost:5432/wacrm
      DATABASE_URL: postgresql://wacrm_owner:ownerpw@localhost:5432/wacrm
      WACRM_OWNER_PASSWORD: ownerpw
      WACRM_AUTHENTICATOR_PASSWORD: authpw
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap + migrate (as the migrate container does)
        run: npm run db:migrate

      - name: Migrations are re-runnable (no-op on second run)
        run: npm run db:migrate

      # The private PostgREST the server data layer talks to (same image
      # and settings as docker-compose.yml). Started after the migrations
      # so its schema cache sees every table.
      - name: Start private PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgresql://wacrm_authenticator:authpw@localhost:5432/wacrm \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=wacrm_anon \
            -e PGRST_JWT_SECRET=ci-postgrest-jwt-secret-0123456789abcdef \
            -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.12
          for i in $(seq 1 30); do
            # Any HTTP status means it is up and has loaded its schema cache.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ || true)
            [ "$code" != "000" ] && exit 0
            sleep 1
          done
          docker logs postgrest
          exit 1

      # SMTP sink for the email tests (verification / reset / invite).
      - name: Start Mailpit
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.27.0
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8025/readyz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs mailpit
          exit 1

      - name: Run the isolation suite on the new stack
        env:
          TEST_DATABASE_URL: postgresql://postgres:admin@localhost:5432/wacrm
          # Native auth + data layer tests log in as the app does
          # (wacrm_authenticator).
          TEST_AUTHENTICATOR_DATABASE_URL: postgresql://wacrm_authenticator:authpw@localhost:5432/wacrm
          TEST_POSTGREST_URL: http://localhost:3001
          TEST_POSTGREST_JWT_SECRET: ci-postgrest-jwt-secret-0123456789abcdef
          TEST_SMTP_HOST: 127.0.0.1
          TEST_SMTP_PORT: '1025'
          TEST_MAILPIT_URL: http://localhost:8025
        run: npm run test:db
