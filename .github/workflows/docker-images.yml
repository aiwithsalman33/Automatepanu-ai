name: Docker images

# Builds the production images on GitHub's runners and pushes them to
# GitHub Container Registry, so the VPS never runs `next build` (it is
# too memory-hungry for a small server). Dokploy only pulls:
#   ghcr.io/<owner>/automatepanu-app:latest
#   ghcr.io/<owner>/automatepanu-migrate:latest
# (plus an immutable :sha-<commit> tag for rollbacks).
#
# Optional: set the repository secret DOKPLOY_DEPLOY_WEBHOOK (Dokploy →
# your compose app → Deployments → webhook URL) to redeploy
# automatically once the images are pushed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/automatepanu-app:latest
            ${{ env.REGISTRY }}/automatepanu-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # NEXT_PUBLIC_* are inlined into the build. Override with
          # repository variables (Settings → Variables) if the domain changes.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://chat.axxeler.in' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://chat.axxeler.in' }}
            NEXT_PUBLIC_APP_LOCALE=${{ vars.NEXT_PUBLIC_APP_LOCALE || 'en' }}
            NEXT_BUILD_CPUS=4
            BUILD_MAX_OLD_SPACE=6144
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.REGISTRY }}/automatepanu-migrate:latest
            ${{ env.REGISTRY }}/automatepanu-migrate:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Trigger Dokploy deploy (optional)
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" -o /dev/null && echo "Dokploy deploy triggered"
